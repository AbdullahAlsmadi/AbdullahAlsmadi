<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: "Courier New", Courier, monospace; }
  </style>
  <!-- Main background and border -->
  <rect width="1180" height="610" rx="10" fill="#0A101F" stroke="#A78BFA" stroke-width="2"/>
  
  <!-- Header -->
  <text x="590" y="30" fill="#94A3B8" font-family="monospace" font-size="14" text-anchor="middle">profile.sh --live</text>
  
